<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta Domótica</title>
<style>
:root{--bg:#10141c;--floor:#1a2030;--wall:#8fa3c4;--ink:#c9d4ea;--on:#ffd23f;--off:#4a5675;--glow:rgba(255,210,63,.13)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:12px}
h1{font-size:1.1rem;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input,button{background:#1f2738;color:var(--ink);border:1px solid #33405e;border-radius:6px;padding:7px 10px;font-size:.85rem}
button{cursor:pointer}button:hover{border-color:var(--on)}
#st{font-size:.8rem;opacity:.8}
svg{width:100%;max-width:820px;height:auto;display:block;margin:auto}
.room{fill:var(--floor);transition:fill .3s}
.room.lit{fill:#3a3520}
.room.verde{fill:#17261d}.room.verde.lit{fill:#244a30}
.tree .t{fill:#1d3a26;stroke:#4a5675;stroke-width:2;transition:all .3s}
.tree .orn{fill:#4a5675;transition:fill .3s}
.tree .star{fill:#4a5675;transition:fill .3s}
.tree.on .t{fill:#1f8a3b;stroke:#6fe08a}
.tree.on .star{fill:#ffd23f}
.tree.on .orn{animation:bl 1.2s infinite alternate}
.tree.on .orn:nth-of-type(2n){animation-delay:.4s}
.tree.on .orn:nth-of-type(3n){animation-delay:.8s}
@keyframes bl{0%{fill:#ff4d4d}33%{fill:#ffd23f}66%{fill:#4da3ff}100%{fill:#ff7bf0}}
.tree.on{filter:drop-shadow(0 0 9px #4ade80)}
.wall{stroke:var(--wall);stroke-width:5;stroke-linecap:square;fill:none}
.gap{fill:var(--floor);stroke:none}
.furn{fill:none;stroke:#5d6d92;stroke-width:1.5}
.lbl{fill:#6d7fa6;font-size:13px;letter-spacing:1px;text-anchor:middle;pointer-events:none}
.dim{fill:#6d7fa6;font-size:11px}
.light{cursor:pointer}
.light .sh{fill:#1a2030;stroke:var(--off);stroke-width:2.5;transition:all .25s}
.light .cr{stroke:var(--off);stroke-width:2.5;transition:stroke .25s}
.light{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.light:hover{transform:scale(1.15)}
.light.on .sh{fill:#4d4210;stroke:var(--on)}
.light.on .cr{stroke:var(--on)}
.light.on{filter:drop-shadow(0 0 7px var(--on))}
.door{cursor:pointer}
.leaf{stroke:#e8b86d;stroke-width:5;stroke-linecap:round}
.arc{fill:none;stroke:#6d7fa6;stroke-width:1.5;stroke-dasharray:5 4}
.dl{transition:transform .7s cubic-bezier(.4,0,.2,1)}
.open{stroke:#33405e;stroke-width:2;stroke-dasharray:4 4;fill:none}
.gdoor{cursor:pointer}
.slat{stroke:#e5383b;stroke-width:8}
.gl{transition:transform .9s cubic-bezier(.5,0,.2,1)}
.garrow{fill:none;stroke:#e5383b;stroke-width:2;stroke-dasharray:5 4;opacity:.85}
.gdoor:hover .slat{stroke:#ff5a5f}
</style>
</head>
<body>
<h1>🏠 Maqueta Domótica</h1>
<div class="bar">
  <button id="all1">Encender todo</button>
  <button id="all0">Apagar todo</button>
  <span id="st">Listo</span>
</div>
<svg id="p" viewBox="-130 0 930 770" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('p');
const $=(t,a={},par=svg,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;par.appendChild(e);return e};

// ---------- Habitaciones ----------
const rooms={
 garage:[20,20,640,230],verde:[660,20,120,230],
 bano:[20,250,330,240],cocina:[350,250,340,240],
 dorm:[20,490,330,250],sala:[350,490,340,250],pasillo:[690,250,90,490]
};
const roomEls={};
for(const k in rooms){const [x,y,w,h]=rooms[k];roomEls[k]=$('rect',{x,y,width:w,height:h,class:'room'})}
roomEls.verde.classList.add('verde');
// patrón de pasto
const df=$('defs');const pt=$('pattern',{id:'g',width:10,height:10,patternUnits:'userSpaceOnUse'},df);
$('path',{d:'M0 10L10 0',stroke:'#2d4a37','stroke-width':1},pt);
$('rect',{x:660,y:20,width:120,height:230,fill:'url(#g)'});

// ---------- Muros (con huecos para puertas) ----------
const W=(d)=>$('path',{d,class:'wall'});
W('M20 20H780V740H20Z');                 // perímetro
W('M660 20V90M660 190V250');              // garage | área verde (hueco puerta del garage 90-190)
W('M20 250H780');                         // garage / casa (sin puerta)
W('M350 250V490');                        // baño | cocina (muro cerrado, sin puerta)
W('M350 490V560M350 620V740');            // dormitorio | sala (hueco puerta 560-620)
W('M20 490H70M130 490H350');              // baño / dormitorio (hueco puerta 70-130)
W('M350 490H440M600 490H690');            // cocina / sala (entrada libre 440-600)
$('path',{d:'M440 490H600',class:'open'});
W('M690 250V497M690 557V740');            // pasillo (puerta a la sala pegada al comedor 497-557)

// ---------- Mobiliario ----------
const R=(x,y,w,h,rx=0)=>$('rect',{x,y,width:w,height:h,rx,class:'furn'});
const C=(x,y,r)=>$('circle',{cx:x,cy:y,r,class:'furn'});
R(40,265,38,54,12);R(40,345,34,44,10); // baño (arriba-izquierda)
R(40,570,120,130,4);R(40,542,24,24);R(40,704,24,24);R(46,580,40,32,6);R(46,658,40,32,6); // dormitorio (abajo-izquierda)
R(400,262,270,34);R(636,262,34,150);R(430,375,140,28,3);C(450,432,11);C(500,432,11);C(550,432,11); // cocina
R(420,670,200,50,12);R(445,670,150,26,6);$('ellipse',{cx:520,cy:610,rx:50,ry:30,class:'furn'}); // sala
[['garage','GARAGE',340,45],['verde','ÁREA VERDE',720,240],['bano','BAÑO',185,278],['cocina','COCINA / COMEDOR',520,468],
 ['dorm','DORMITORIO',270,727],['sala','SALA DE ESTAR',520,725],['pasillo','PASILLO',735,720]].forEach(([k,t,x,y])=>$('text',{x,y,class:'lbl'},svg,t));
$('text',{x:-60,y:222,class:'lbl'},svg,'EXTERIOR');
$('text',{x:340,y:765,class:'dim'},svg,'20 cm');$('text',{x:728,y:765,class:'dim'},svg,'5 cm');
$('text',{x:2,y:140,class:'dim'},svg,'10,4');$('text',{x:665,y:14,class:'dim'},svg,'3,14 cm');

// ---------- Puertas ----------
// hx,hy bisagra · a ángulo cerrado (0=derecha, 90=abajo) · s ±90 giro · L largo
const rad=d=>d*Math.PI/180;
function door(id,hx,hy,a,s,L=60){
 const g=$('g',{class:'door',id});
 const ce=[hx+L*Math.cos(rad(a)),hy+L*Math.sin(rad(a))],oe=[hx+L*Math.cos(rad(a+s)),hy+L*Math.sin(rad(a+s))];
 $('path',{class:'arc',d:`M${ce[0]} ${ce[1]}A${L} ${L} 0 0 ${s>0?1:0} ${oe[0]} ${oe[1]}`},g);
 const dl=$('g',{class:'dl'},g);dl.style.transformOrigin=`${hx}px ${hy}px`;
 $('line',{class:'leaf',x1:hx,y1:hy,x2:ce[0],y2:ce[1]},dl);
 $('circle',{cx:hx,cy:hy,r:4,fill:'#e8b86d'},g);
 let open=false;g.addEventListener('click',()=>{open=!open;dl.style.transform=open?`rotate(${s}deg)`:'none'});
}
door('p1',70,490,0,-90);    // Baño ↔ Dormitorio (abre hacia el baño)
door('p3',350,560,90,-90);  // Dormitorio → Sala
door('p4',690,497,90,90);   // Pasillo → Sala de estar (pegada a la pared del comedor)

// Puerta del garage: roja, abre HACIA ARRIBA (se recoge)
(function(){
 const g=$('g',{class:'gdoor',id:'pg'});
 $('title',{},g,'Puerta del garage');
 $('rect',{x:652,y:84,width:16,height:112,fill:'transparent'},g);
 $('path',{class:'garrow',d:'M646 185V99M640 107L646 98L652 107'},g);
 const gl=$('g',{class:'gl'},g);gl.style.transformOrigin='660px 90px';
 for(let i=0;i<5;i++)$('line',{class:'slat',x1:660,y1:90+i*20,x2:660,y2:106+i*20},gl);
 $('rect',{x:653,y:82,width:14,height:8,rx:2,fill:'#9d1f26'},g);
 let o=false;g.addEventListener('click',()=>{o=!o;gl.style.transform=o?'scaleY(.1)':'none'});
})();

// ---------- Luces ----------
// tipo x = punto de luz (cuadro con X) · f = foco (círculo)
const luces=[
 ['garage_x1','x',240,135,'garage'],['garage_x2','x',440,135,'garage'],
 ['verde_f1','f',680,55,'verde'],['verde_f2','f',680,215,'verde'],['verde_arbol','t',-60,140,'ext'],
 ['bano_x1','x',200,370,'bano'],
 ['dorm_x1','x',240,620,'dorm'],['dorm_f2','f',52,554,'dorm'],['dorm_f3','f',52,716,'dorm'],
 ['cocina_x1','x',470,335,'cocina'],
 ['sala_x1','x',520,535,'sala'],
 ['pasillo_f1','f',735,330,'pasillo'],['pasillo_f2','f',735,640,'pasillo']
];
const estado={},byRoom={};
const ESP_IP='';// <- escribe aquí la IP del ESP32 (ej. '192.168.1.50')
const st=document.getElementById('st');

async function enviar(id,on){
 const host=ESP_IP.trim();
 if(!host){st.textContent='Modo simulación';return}
 try{
  const r=await fetch(`http://${host}/luz?id=${id}&estado=${on?'on':'off'}`);
  st.textContent=r.ok?`✔ ${id} → ${on?'ON':'OFF'}`:`⚠ Error ${r.status}`;
 }catch(e){st.textContent='⚠ No se pudo conectar al ESP32'}
}
function refrescarCuarto(r){
 if(!roomEls[r])return;
 const n=luces.filter(l=>l[4]===r&&estado[l[0]]).length;
 roomEls[r].classList.toggle('lit',n>0);
}
function set(id,on,send=true){
 const l=luces.find(l=>l[0]===id);estado[id]=on;
 document.getElementById(id).classList.toggle('on',on);
 refrescarCuarto(l[4]);if(send)enviar(id,on);
}
luces.forEach(([id,t,x,y,r])=>{
 const g=$('g',{class:'light',id});estado[id]=false;
 if(t==='t'){
  g.setAttribute('class','light tree');
  const o=x-710,sh=q=>q.split(' ').map(v=>{const[a,b]=v.split(',');return(+a+o)+','+b}).join(' ');
  $('rect',{x:703+o,y:176,width:14,height:22,fill:'#6b4a2b'},g);
  ['710,92 676,132 744,132','710,116 670,164 750,164','710,142 664,184 756,184'].forEach(p=>$('polygon',{class:'t',points:sh(p)},g));
  $('polygon',{class:'star',points:sh('710,64 714,76 727,76 717,84 721,97 710,89 699,97 703,84 693,76 706,76')},g);
  [[700,120],[722,140],[690,158],[728,168],[708,176],[696,176]].forEach(([a,b])=>$('circle',{class:'orn',cx:a+o,cy:b,r:4},g));
 }else if(t==='x'){
  $('rect',{class:'sh',x:x-16,y:y-16,width:32,height:32,rx:2},g);
  $('path',{class:'cr',d:`M${x-12} ${y-12}L${x+12} ${y+12}M${x+12} ${y-12}L${x-12} ${y+12}`},g);
 }else{
  $('circle',{class:'sh',cx:x,cy:y,r:12},g);
  $('path',{class:'cr',d:`M${x-8} ${y-8}L${x+8} ${y+8}M${x+8} ${y-8}L${x-8} ${y+8}`},g);
 }
 const tt=$('title',{},g,id);
 g.addEventListener('click',()=>set(id,!estado[id]));
});
document.getElementById('all1').onclick=()=>luces.forEach(l=>set(l[0],true));
document.getElementById('all0').onclick=()=>luces.forEach(l=>set(l[0],false));
</script>
</body>
</html>
